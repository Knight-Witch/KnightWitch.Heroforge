name: Materialize Spinny Dev Download UX Fix
on:
  push:
    branches: [spinny-dev-download-ux-fix]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Witch Dock Dev target
        uses: actions/checkout@v4
        with:
          ref: WITCH_DEV_UI
          path: wd
          fetch-depth: 0
      - name: Checkout staging helper
        uses: actions/checkout@v4
        with:
          ref: spinny-dev-download-ux-fix
          path: stage
          fetch-depth: 1
      - name: Apply and verify Spinny hardening
        shell: bash
        run: |
          set -euo pipefail
          python stage/staging/patch_spinny_download_ux.py wd
          node --check wd/features/media/Spinny_Mini_WebP.js
          node --check wd/features/media/Spinny_Mini_WebP_UI.js
          node --check wd/Witch_Dock_DEV.user.js
          python -m json.tool wd/manifest.json >/dev/null
          python - <<'PY'
          import json
          s=open('wd/features/media/Spinny_Mini_WebP.js').read()
          u=open('wd/features/media/Spinny_Mini_WebP_UI.js').read()
          d=open('wd/Witch_Dock_DEV.user.js').read()
          m=json.load(open('wd/manifest.json'))
          r={x['id']:x for x in m['moduleRegistry']}
          assert "const VERSION = '0.5.1'" in s
          assert 'const downloadResult = await downloadBlob(outputBlob, profile);' in s
          assert 'downloadConfirmed' in s
          assert "if (event.type === 'wheel') return;" in s
          assert "label: '1024px'" in s and "label: '2048px'" in s and "label: '3072px'" in s
          assert "const VERSION = '0.1.1'" in u
          assert 'select option{background:#29292d;color:#fff;}' in u
          assert 'Pop out into free-floating window' in u
          assert 'Download complete' in u
          assert '// @grant        GM_download' in d
          assert 'UW.WitchDock.downloadBlob = kwDownloadBlob;' in d
          assert 'GM_download({' in d
          assert r['witch-dock-dev-loader']['version']=='0.2.0'
          assert r['spinny-mini-webp']['version']=='0.5.1'
          assert r['spinny-mini-webp-ui']['version']=='0.1.1'
          PY
          git -C wd diff --check
      - name: Commit to Witch Dock Dev
        shell: bash
        run: |
          set -euo pipefail
          git -C wd config user.name 'Knight Witch'
          git -C wd config user.email 'amanda.m.ivans@gmail.com'
          git -C wd add Witch_Dock_DEV.user.js features/media/Spinny_Mini_WebP.js features/media/Spinny_Mini_WebP_UI.js manifest.json MASTER.md HISTORY/BULLSHIT/WITCH_DOCK_UI_FOLLOWUPS.md PRE_FLIGHT_Check.md CHANGELOG.md
          git -C wd commit -m 'Harden Spinny Dev download and capture UX'
          git -C wd push origin HEAD:WITCH_DEV_UI
