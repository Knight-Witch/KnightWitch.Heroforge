name: Materialize Witch Dock v1.2.0 Stable
on:
  push:
    branches: [witch-v120-promotion-helper]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper
        uses: actions/checkout@v4
        with:
          ref: witch-v120-promotion-helper
          path: helper
      - name: Checkout Stable candidate
        uses: actions/checkout@v4
        with:
          ref: witch-v120-stable-candidate
          path: target
          fetch-depth: 0
      - name: Checkout validated Dev
        uses: actions/checkout@v4
        with:
          ref: WITCH_DEV_UI
          path: dev
          fetch-depth: 1
      - name: Protect unrelated validated runtime
        shell: bash
        run: |
          set -euo pipefail
          cd target
          sha256sum \
            features/media/Spinny_Mini_WebP.js \
            features/media/Spinny_Mini_WebP_UI.js \
            HeroForge_UI/Photo_Booth_True_Resolution_Readiness.js \
            tools/Booth.js \
            HeroForge_UI/Corrected_Bound_Decal_Gizmo.js \
            > /tmp/witch-v120-protected.sha256
      - name: Apply narrow promotion
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python ../helper/.github/scripts/promote_witch_v120.py
          python ../helper/.github/scripts/normalize_witch_v120_docs.py
      - name: Static release gate
        shell: bash
        run: |
          set -euo pipefail
          cd target
          sha256sum -c /tmp/witch-v120-protected.sha256
          node --check Witch_Dock.user.js
          node --check features/core/Witch_Dock_Developer_Mode.js
          node --check features/media/Photo_Booth_True_Resolution.js
          node --check features/media/Photo_Booth_True_Resolution_UI.js
          node --check features/media/Spinny_Mini_WebP.js
          node --check features/media/Spinny_Mini_WebP_UI.js
          python -m json.tool manifest.json >/dev/null
          python ../helper/.github/scripts/gate_witch_v120.py
          git diff --check
      - name: Commit Stable candidate
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name "Knight Witch"
          git config user.email "amanda.m.ivans@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Release Witch Dock v1.2.0 UI and Developer Mode"
          git push origin HEAD:witch-v120-stable-candidate
