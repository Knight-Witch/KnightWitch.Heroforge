name: Temporary Black Canvas validator

on:
  push:
    branches:
      - WITCH_DEV_CACHE_CANDIDATE_20260907

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: WITCH_DEV_BLACK_STARTUP_CANDIDATE_20260907
          fetch-depth: 0

      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin WITCH_DEV_UI

          node --check features/booth/Black_Canvas_Display_Replay.js
          python3 -m json.tool manifest.json >/dev/null
          git diff --check origin/WITCH_DEV_UI...HEAD

          python3 - <<'PY'
          import json
          with open('manifest.json', encoding='utf-8') as f:
              m = json.load(f)
          reg = {x['id']: x for x in m['moduleRegistry']}
          tools = {x['id']: x for x in m['tools']}
          r = reg['booth-black-canvas-display-replay']
          assert r['version'] == '0.1.2'
          assert r['build'] == '0.1.2-dev-stable-state-plus-pre-bt-background'
          assert 'v=0.1.2-dev-stable-state-plus-pre-bt-background' in tools['booth-black-canvas-display-replay']['url']
          PY

          expected="$(printf '%s\n' CHANGELOG.md HISTORY/BULLSHIT/BOOTH_BLACK_CANVAS_DISPLAY_REPLAY.md MASTER.md PRE_FLIGHT_Check.md features/booth/Black_Canvas_Display_Replay.js manifest.json | sort)"
          actual="$(git diff --name-only origin/WITCH_DEV_UI...HEAD | sort)"
          test "$actual" = "$expected"

          for path in \
            tools/Booth.js \
            tools/Utilities.js \
            features/booth/Booth_Runtime_Bootstrap.js \
            Witch_Dock_DEV.user.js \
            features/media/Spinny_Mini_WebP.js \
            features/media/Photo_Booth_True_Resolution.js \
            HeroForge_UI/Corrected_Bound_Decal_Gizmo.js \
            tools/JSON_Tool.js \
            features/core/Witch_Dock_Developer_Mode.js
          do
            test "$(git rev-parse HEAD:$path)" = "$(git rev-parse origin/WITCH_DEV_UI:$path)"
          done

          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync('features/booth/Black_Canvas_Display_Replay.js', 'utf8');

          function runCase({ withBT = false, useDiag = false }) {
            let blackOn = true;
            let nativeUpdates = 0;
            let scheduled = null;
            const direct = { visible: true };
            const named = { name: 'background', visible: true, children: [] };
            const envRoot = { name: 'environment', visible: true, children: [named] };
            const scene = {
              children: [envRoot],
              getObjectByName(name) {
                if (name === 'environment') return envRoot;
                if (name === 'background') return named;
                return null;
              }
            };
            const overlays = {
              backgroundPlane: { visible: true, parent: scene },
              framePlane: { visible: true },
              shadowPlane: { visible: true },
              mask: { visible: true }
            };
            const canvas = { style: { backgroundColor: '' }, parentElement: { style: { backgroundColor: '' } } };
            const display = { update() { nativeUpdates += 1; return 'native'; } };
            const UW = {
              CK: {
                character: { display },
                environment: { background: { mesh: direct } },
                renderManager: { renderer: { domElement: canvas } }
              },
              setTimeout(fn) { scheduled = fn; return 1; },
              clearTimeout() {},
              console: { log() {} }
            };
            if (useDiag) UW.KW_WD_BOOTH_DIAG = () => JSON.stringify({ blackCanvasOn: blackOn });
            else UW.KW_WD_BOOTH = { getState: () => ({ sessionBlackCanvas: blackOn }) };
            if (withBT) {
              UW.BT = {
                display: {
                  environment: { setDefaultEnvironmentVisibility() {} },
                  overlays
                }
              };
            }

            const context = {
              unsafeWindow: UW,
              window: UW,
              setTimeout: UW.setTimeout,
              clearTimeout: UW.clearTimeout,
              console: UW.console,
              JSON,
              Object,
              Array,
              String,
              Date
            };
            vm.createContext(context);
            vm.runInContext(source, context);

            if (withBT) {
              if (named.visible !== false) throw new Error('BT semantic background was not hidden');
              if (direct.visible !== true) throw new Error('Direct CK fallback incorrectly won while BT existed');
            } else {
              if (direct.visible !== false) throw new Error('Pre-BT CK background mesh was not hidden');
            }

            const result = display.update();
            if (result !== 'native' || nativeUpdates !== 1) throw new Error('Native display.update was not preserved');

            blackOn = false;
            if (!scheduled) throw new Error('Poll was not scheduled');
            scheduled();
            if (withBT && named.visible !== true) throw new Error('BT semantic background did not restore');
            if (!withBT && direct.visible !== true) throw new Error('Pre-BT CK background did not restore');

            const api = UW.KW_WD_BOOTH_BLACK_REPLAY;
            if (!api || api.version !== '0.1.2') throw new Error('Replay API/version missing');
            api.dispose();
            if (display.update === undefined || display.update() !== 'native') throw new Error('Dispose did not restore native update');
          }

          runCase({ withBT: false, useDiag: false });
          runCase({ withBT: false, useDiag: true });
          runCase({ withBT: true, useDiag: false });
          console.log('Black Canvas candidate lifecycle mocks: PASS');
          NODE
