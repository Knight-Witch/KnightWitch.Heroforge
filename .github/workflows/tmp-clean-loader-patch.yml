name: Temporary Booth environment ownership candidate builder

on:
  push:
    branches:
      - WITCH_DEV_CACHE_CANDIDATE_20260907

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate isolated Booth environment candidate
        shell: bash
        run: |
          set -euo pipefail
          cp .github/tmp_booth_env_patch.py /tmp/tmp_booth_env_patch.py
          cp .github/tmp_booth_env_validate.js /tmp/tmp_booth_env_validate.js
          python3 .github/tmp_fix_booth_env_master_eof.py /tmp/tmp_booth_env_patch.py

          python3 -m py_compile /tmp/tmp_booth_env_patch.py
          node --check /tmp/tmp_booth_env_validate.js
          git fetch origin WITCH_DEV_UI
          test "$(git rev-parse origin/WITCH_DEV_UI)" = "ca27025e137049640e50b68d98d9cdca70ed59a8"
          git checkout -B WITCH_DEV_BOOTH_ENV_OWNERSHIP_CANDIDATE_20260907 origin/WITCH_DEV_UI

          python3 /tmp/tmp_booth_env_patch.py
          node --check tools/Booth.js
          node --check features/booth/Black_Canvas_Display_Replay.js
          python3 -m json.tool manifest.json >/dev/null
          node /tmp/tmp_booth_env_validate.js
          git diff --check

          expected="$(printf '%s\n' \
            CHANGELOG.md \
            HISTORY/BULLSHIT/BOOTH_BLACK_CANVAS_DISPLAY_REPLAY.md \
            HISTORY/BULLSHIT/BOOTH_V27_STABILIZATION.md \
            MASTER.md \
            PRE_FLIGHT_Check.md \
            features/booth/Black_Canvas_Display_Replay.js \
            manifest.json \
            tools/Booth.js | sort)"
          actual="$(git diff --name-only | sort)"
          printf 'Expected files:\n%s\nActual files:\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

          for path in \
            features/booth/Booth_Runtime_Bootstrap.js \
            tools/Utilities.js \
            Witch_Dock_DEV.user.js \
            HeroForge_UI/Corrected_Bound_Decal_Gizmo.js \
            features/media/Spinny_Mini_WebP.js \
            features/media/Spinny_Mini_WebP_UI.js \
            features/media/Photo_Booth_True_Resolution.js \
            features/media/Photo_Booth_True_Resolution_UI.js \
            HeroForge_UI/Photo_Booth_True_Resolution_Readiness.js \
            tools/JSON_Tool.js \
            features/core/Witch_Dock_Developer_Mode.js \
            tools/Decals.js; do
            test "$(git hash-object "$path")" = "$(git rev-parse origin/WITCH_DEV_UI:$path)"
          done
          echo 'protected working-tree blobs: PASS'

          git config user.name "Knight Witch Dev Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            PRE_FLIGHT_Check.md \
            MASTER.md \
            manifest.json \
            tools/Booth.js \
            features/booth/Black_Canvas_Display_Replay.js \
            HISTORY/BULLSHIT/BOOTH_V27_STABILIZATION.md \
            HISTORY/BULLSHIT/BOOTH_BLACK_CANVAS_DISPLAY_REPLAY.md
          git commit -m "Repair Dev Booth environment ownership"

          node --check tools/Booth.js
          node --check features/booth/Black_Canvas_Display_Replay.js
          python3 -m json.tool manifest.json >/dev/null
          node /tmp/tmp_booth_env_validate.js
          git diff --check HEAD^
          test "$(git diff --name-only HEAD^...HEAD | sort)" = "$expected"

          for path in \
            features/booth/Booth_Runtime_Bootstrap.js \
            tools/Utilities.js \
            Witch_Dock_DEV.user.js \
            HeroForge_UI/Corrected_Bound_Decal_Gizmo.js \
            features/media/Spinny_Mini_WebP.js \
            features/media/Spinny_Mini_WebP_UI.js \
            features/media/Photo_Booth_True_Resolution.js \
            features/media/Photo_Booth_True_Resolution_UI.js \
            HeroForge_UI/Photo_Booth_True_Resolution_Readiness.js \
            tools/JSON_Tool.js \
            features/core/Witch_Dock_Developer_Mode.js \
            tools/Decals.js; do
            test "$(git rev-parse HEAD:$path)" = "$(git rev-parse origin/WITCH_DEV_UI:$path)"
          done
          echo 'protected committed blobs: PASS'

          git push --force-with-lease origin WITCH_DEV_BOOTH_ENV_OWNERSHIP_CANDIDATE_20260907
