name: Temporary Black Canvas startup candidate

on:
  push:
    branches:
      - WITCH_DEV_CACHE_CANDIDATE_20260907

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Black Canvas startup candidate from current Dev
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin WITCH_DEV_UI
          git checkout -B WITCH_DEV_BLACK_STARTUP_CANDIDATE_20260907 origin/WITCH_DEV_UI
          python3 - <<'PY'
          from pathlib import Path

          replay = Path('features/booth/Black_Canvas_Display_Replay.js')
          r = replay.read_text(encoding='utf-8')
          replacements = [
              ("  const VERSION = '0.1.0';", "  const VERSION = '0.2.0';"),
              ("  const BUILD = '0.1.0-dev-post-display-update-replay';", "  const BUILD = '0.2.0-dev-pre-bt-main-background-fallback';"),
              (
'''  function discoverSemanticBackground() {
    try {
      const BT = UW.BT;
      const overlays = BT && BT.display ? BT.display.overlays : null;
      const scene = overlays && overlays.backgroundPlane ? overlays.backgroundPlane.parent : null;
      if (!scene) return null;

      const environmentRoot = namedChild(scene, 'environment');
      if (!environmentRoot) return null;
      return namedChild(environmentRoot, 'background');
    } catch (error) {
      recordError('discoverSemanticBackground', error);
      return null;
    }
  }
''',
'''  function discoverCKEnvironmentBackground() {
    try {
      const CK = UW.CK;
      const background = CK && CK.environment ? CK.environment.background : null;
      const mesh = background && background.mesh ? background.mesh : null;
      return mesh && 'visible' in mesh ? mesh : null;
    } catch (error) {
      recordError('discoverCKEnvironmentBackground', error);
      return null;
    }
  }

  function discoverSemanticBackground() {
    try {
      const directBackground = discoverCKEnvironmentBackground();

      // If the pre-BT fallback already owns the live CK environment mesh, keep
      // using that same object instead of switching ownership merely because
      // HeroForge later creates BT. This avoids a restore/hide handoff on the
      // same startup path. Existing BT-first behavior is unchanged when BT is
      // present before this module first acquires a background target.
      if (directBackground && state.semanticBackground === directBackground) return directBackground;

      const BT = UW.BT;
      const overlays = BT && BT.display ? BT.display.overlays : null;
      const scene = overlays && overlays.backgroundPlane ? overlays.backgroundPlane.parent : null;
      if (scene) {
        const environmentRoot = namedChild(scene, 'environment');
        if (environmentRoot) {
          const namedBackground = namedChild(environmentRoot, 'background');
          if (namedBackground) return namedBackground;
        }
      }

      // Fresh editor startup can have CK.environment before the gated Booth
      // runtime exists. The main display's own applyLighting path uses this
      // background manager and its render mesh, so hide only the render mesh as
      // the conservative no-BT fallback. If the shape is unavailable, do
      // nothing and retry on the normal poll.
      return directBackground;
    } catch (error) {
      recordError('discoverSemanticBackground', error);
      return null;
    }
  }
'''
              )
          ]
          for old, new in replacements:
              count = r.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one replay match, got {count}: {old[:100]!r}')
              r = r.replace(old, new, 1)
          replay.write_text(r, encoding='utf-8', newline='\n')

          manifest = Path('manifest.json')
          m = manifest.read_text(encoding='utf-8')
          old = '''      "id": "booth-black-canvas-display-replay",\n      "title": "Booth Black Canvas Display Replay",\n      "path": "features/booth/Black_Canvas_Display_Replay.js",\n      "kind": "compatibility-feature",\n      "load": "manifest",\n      "version": "0.1.0",\n      "build": "0.1.0-dev-post-display-update-replay",\n      "versionOrigin": "new-dev-module"'''
          new = '''      "id": "booth-black-canvas-display-replay",\n      "title": "Booth Black Canvas Display Replay",\n      "path": "features/booth/Black_Canvas_Display_Replay.js",\n      "kind": "compatibility-feature",\n      "load": "manifest",\n      "version": "0.2.0",\n      "build": "0.2.0-dev-pre-bt-main-background-fallback",\n      "versionOrigin": "dev-black-canvas-pre-bt-fallback-2026-09-07"'''
          if m.count(old) != 1:
              raise SystemExit('Unexpected replay registry entry')
          m = m.replace(old, new, 1)
          old_url = 'https://raw.githubusercontent.com/Knight-Witch/KnightWitch.Heroforge/WITCH_DEV_UI/features/booth/Black_Canvas_Display_Replay.js?v=0.1.0-dev-post-display-update-replay'
          new_url = 'https://raw.githubusercontent.com/Knight-Witch/KnightWitch.Heroforge/WITCH_DEV_UI/features/booth/Black_Canvas_Display_Replay.js?v=0.2.0-dev-pre-bt-main-background-fallback'
          if m.count(old_url) != 1:
              raise SystemExit('Unexpected replay tools URL')
          manifest.write_text(m.replace(old_url, new_url, 1), encoding='utf-8', newline='\n')

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text(encoding='utf-8')
          marker = '# Changelog\n\n'
          if not c.startswith(marker):
              raise SystemExit('Unexpected CHANGELOG header')
          entry = '''## DOCK-2026-09-07-041 — Add Dev Black Canvas pre-BT fallback\n\nDate: 2026-09-07\n\n### Summary\n\nExtended the already-validated Black Canvas display replay so the editor can hide HeroForge's main environment background before the gated Booth runtime (`BT`) exists. The validated post-`display.update()` wrapper and BT semantic named-background path remain intact and preferred.\n\n### Confirmed evidence\n\n- prior HF-Chat-Bridge runtime reads confirmed `CK.environment.background` exists on the regular main display path;\n- `CK.character.display.applyLighting()` directly calls `CK.environment.background.updateValues(...)`;\n- the background manager's own `updateValues()` source operates on `this.mesh.material`, confirming it owns a render mesh independent of BT;\n- Booth v27 already exposes the saved Black Canvas default through `KW_WD_BOOTH.getState().sessionBlackCanvas` before BT exists;\n- renderer canvas/holder black CSS replay already works without BT.\n\n### Supported inference / live gate\n\n`CK.environment.background.mesh` is the conservative regular-scene render target for pre-BT visibility suppression. The candidate changes only that mesh's `visible` flag when the validated BT scene path is unavailable. The exact fresh-start visual result remains a live Dev validation item; failure degrades to retry/no-op rather than enabling Booth.\n\n### Changes\n\n- bumped Dev replay to v0.2.0 / build `0.2.0-dev-pre-bt-main-background-fallback`;\n- added `CK.environment.background.mesh` discovery as a no-BT fallback;\n- existing BT semantic `environment -> background` discovery remains first choice when BT exists before ownership is acquired;\n- if the direct CK mesh was already acquired pre-BT, the module retains that same owned object when BT later appears, avoiding an unnecessary restore/hide ownership handoff;\n- no Booth bootstrap is triggered by Black Canvas alone.\n\n### Preserved boundaries\n\n- native `CK.character.display.update()` always runs;\n- the validated white-flash replay sequencing is unchanged;\n- Booth v27, Utilities v1.2.1, Booth runtime bootstrap, Dev loader v0.5.1, Spinny, High Res, corrected decal gizmo, JSON, Developer Mode, Decals host, and tab infrastructure are unchanged;\n- public Stable replay v0.1.1 remains unchanged.\n\n### Validation\n\n- JavaScript syntax: PASS.\n- No-BT mock: PASS — direct CK background mesh hidden, canvas/holder black, native display update still executes, Black Canvas OFF restores owned visibility.\n- BT-present regression mock: PASS — existing named `environment -> background` target remains preferred and restores correctly.\n- Manifest JSON parse: PASS.\n- `git diff --check`: PASS.\n- protected Booth/Utilities/bootstrap/loader blobs unchanged.\n- live fresh-start visual validation: pending.\n\n**Runtime behavior changed:** yes, Dev Black Canvas startup only. Public Stable remains unchanged.\n'''
          changelog.write_text(marker + entry + '\n---\n\n' + c[len(marker):], encoding='utf-8', newline='\n')

          preflight = Path('PRE_FLIGHT_Check.md')
          p = preflight.read_text(encoding='utf-8')
          marker = '# Pre-Flight Check Log\n\n'
          if not p.startswith(marker):
              raise SystemExit('Unexpected PRE_FLIGHT header')
          entry = '''## PFC-2026-09-07-041 — Black Canvas pre-BT main-background fallback\n\nDate: 2026-09-07\n\n### Required material reviewed\n\n- binding HeroForge.Compatibility preflight/architecture/testing requirements;\n- current Dev Booth v27, Utilities v1.2.1, Booth runtime bootstrap, Black Canvas display replay, manifest, and loader;\n- Black Canvas white-flash investigation/history;\n- prior bridge evidence for `CK.environment.background`, `CK.environment.background.updateValues`, and `CK.character.display.applyLighting`;\n- current Dev baseline after loader repair `6cf10845e394676344ebb8699c654009267c6c61`.\n\n### Confirmed findings\n\n- Black Canvas saved state is available from the Booth API before BT exists;\n- regular HeroForge display lighting uses `CK.environment.background`;\n- that background manager owns a render `mesh`;\n- current replay can blacken renderer CSS without BT but its semantic background discovery is BT-only.\n\n### Decision\n\nAdd one conservative fallback to the existing replay: when the validated BT semantic scene target is unavailable, use only `CK.environment.background.mesh` if it exposes a `visible` capability. Do not bootstrap Booth for Black Canvas alone and do not rewrite the validated display-update wrapper.\n\n### Target files\n\n- `features/booth/Black_Canvas_Display_Replay.js`\n- `manifest.json`\n- `MASTER.md`\n- `PRE_FLIGHT_Check.md`\n- `CHANGELOG.md`\n- `HISTORY/BULLSHIT/BOOTH_BLACK_CANVAS_DISPLAY_REPLAY.md`\n\n### Conflict risks / preservation requirements\n\n- BT semantic named-background discovery remains preferred for already-BT sessions;\n- native display update must always execute;\n- direct CK fallback may only own/restore the visibility value it changed;\n- Black Canvas default must not enable Booth View or load gated Booth core by itself;\n- failure to find the CK mesh must be a no-op/retry, not partial initialization;\n- public Stable remains untouched pending Dev validation.\n\n### Static validation\n\n- replay syntax: PASS.\n- no-BT lifecycle mock: PASS.\n- BT-present semantic-path regression mock: PASS.\n- manifest JSON parse and diff check: PASS.\n- protected blob checks: PASS.\n\n### Live gate\n\nWith Black Canvas Across Sessions ON, verify a fresh ordinary editor page becomes black without Black Canvas forcing Booth View ON. Separately verify saved-Booth persistence still bootstraps Booth when its own persistence default is ON, the known white-flash action remains flash-free, Black Canvas OFF restores the ordinary background, and `+ New Figure` remains untouched.\n\n**Runtime behavior changed:** yes, Dev Black Canvas startup only. Public Stable remains unchanged.\n'''
          preflight.write_text(marker + entry + '\n---\n\n' + p[len(marker):], encoding='utf-8', newline='\n')

          master = Path('MASTER.md')
          ms = master.read_text(encoding='utf-8')
          old = '''- Dev v0.1.0 was live validated: the formerly reliable white flash no longer reproduced and the user reported it worked perfectly.\n- Public Stable contains replay v0.1.1 with the Stable-v24 state fallback; its rendering/replay behavior is unchanged from the validated Dev fix.\n- HeroForge native `CK.character.display.update()` remains untouched and always runs; replay occurs immediately after the update.\n- the real main-scene background is discovered semantically through named `environment -> background`.'''
          new = '''- Dev v0.2.0 keeps the live-validated white-flash replay unchanged and adds a pre-BT regular-scene fallback through `CK.environment.background.mesh`.\n- Public Stable contains replay v0.1.1 and remains unchanged pending Dev validation.\n- HeroForge native `CK.character.display.update()` remains untouched and always runs; replay occurs immediately after the update.\n- when BT already exists, the validated semantic named `environment -> background` path remains preferred; before BT exists, only the regular CK background render mesh is visibility-suppressed.\n- Black Canvas alone does not bootstrap or enable Booth View.\n- pre-BT visual startup behavior is pending the final Dev smoke.'''
          if old not in ms:
              raise SystemExit('MASTER Black Canvas block missing')
          master.write_text(ms.replace(old, new, 1), encoding='utf-8', newline='\n')

          history = Path('HISTORY/BULLSHIT/BOOTH_BLACK_CANVAS_DISPLAY_REPLAY.md')
          h = history.read_text(encoding='utf-8').rstrip()
          addition = '''\n\n## 2026-09-07 pre-BT startup extension\n\nAfter the flash replay was live validated, startup testing exposed a separate persistence boundary: Black Canvas can be saved ON while HeroForge has not yet loaded the gated Booth runtime. The replay already knows the saved Black Canvas state through `KW_WD_BOOTH` and can blacken the renderer canvas/holder without BT, but its semantic main-background lookup originally started from `BT.display.overlays.backgroundPlane.parent`.\n\nPrior bridge evidence confirms the regular main display has `CK.environment.background`; `CK.character.display.applyLighting()` calls its `updateValues()`, and that method operates on `this.mesh.material`. Dev v0.2.0 therefore keeps the validated BT named-background discovery unchanged and adds only `CK.environment.background.mesh` as a fallback when no BT semantic target is available. The fallback is capability-checked for a `visible` property, owns/restores only that visibility value, and does not load or enable Booth.\n\nThis is a supported runtime-shape inference with static lifecycle coverage; the fresh-start visual result remains gated on live Dev validation. Public Stable remains on v0.1.1 until that gate passes.\n'''
          history.write_text(h + addition, encoding='utf-8', newline='\n')
          PY

          node --check features/booth/Black_Canvas_Display_Replay.js
          python3 -m json.tool manifest.json >/dev/null

          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync('features/booth/Black_Canvas_Display_Replay.js', 'utf8');

          function runCase(withBT) {
            let blackOn = true;
            let nativeUpdates = 0;
            let scheduled = null;
            const direct = { visible: true };
            const named = { name: 'background', visible: true, children: [] };
            const envRoot = { name: 'environment', visible: true, children: [named] };
            const scene = { children: [envRoot], getObjectByName(name) { return name === 'environment' ? envRoot : name === 'background' ? named : null; } };
            const backgroundPlane = { visible: true, parent: scene };
            const framePlane = { visible: true };
            const shadowPlane = { visible: true };
            const mask = { visible: true };
            const canvas = { style: { backgroundColor: '' }, parentElement: { style: { backgroundColor: '' } } };
            const display = { update() { nativeUpdates += 1; return 'native'; } };
            const UW = {
              KW_WD_BOOTH: { getState: () => ({ sessionBlackCanvas: blackOn }) },
              CK: {
                character: { display },
                environment: { background: { mesh: direct } },
                renderManager: { renderer: { domElement: canvas } }
              }
            };
            if (withBT) {
              UW.BT = {
                display: {
                  environment: { setDefaultEnvironmentVisibility() {} },
                  overlays: { backgroundPlane, framePlane, shadowPlane, mask }
                }
              };
            }
            const context = {
              unsafeWindow: UW,
              window: UW,
              console: { log() {}, error() {} },
              setTimeout(fn) { scheduled = fn; return 1; },
              clearTimeout() {}
            };
            vm.createContext(context);
            vm.runInContext(source, context);
            const api = UW.KW_WD_BOOTH_BLACK_REPLAY;
            if (!api) throw new Error('Replay API missing');
            if (withBT) {
              if (named.visible !== false) throw new Error('BT named background was not hidden');
              if (direct.visible !== true) throw new Error('Direct fallback incorrectly replaced BT-first path');
            } else {
              if (direct.visible !== false) throw new Error('No-BT CK background mesh was not hidden');
            }
            if (canvas.style.backgroundColor !== '#000000' || canvas.parentElement.style.backgroundColor !== '#000000') throw new Error('Canvas black replay failed');
            const result = display.update();
            if (result !== 'native' || nativeUpdates !== 1) throw new Error('Native display update was not preserved');
            blackOn = false;
            if (typeof scheduled !== 'function') throw new Error('Poll was not scheduled');
            scheduled();
            if (withBT) {
              if (named.visible !== true) throw new Error('BT named background did not restore');
            } else if (direct.visible !== true) {
              throw new Error('No-BT CK background mesh did not restore');
            }
            api.dispose();
          }

          runCase(false);
          runCase(true);
          NODE

          git diff --check

          test "$(git hash-object tools/Booth.js)" = "434b5382c9e8b01e9f9e8bf53d772e72eaf53090"
          test "$(git hash-object tools/Utilities.js)" = "036fca4d7f68a1dee0f7d160777d453ac53274af"
          test "$(git hash-object features/booth/Booth_Runtime_Bootstrap.js)" = "3aaa110b4f09ab74df524e64056406b571357474"

          expected=$(printf '%s\n' CHANGELOG.md HISTORY/BULLSHIT/BOOTH_BLACK_CANVAS_DISPLAY_REPLAY.md MASTER.md PRE_FLIGHT_Check.md features/booth/Black_Canvas_Display_Replay.js manifest.json | sort)
          actual=$(git diff --name-only origin/WITCH_DEV_UI | sort)
          test "$actual" = "$expected"

          git config user.name "Knight Witch Dev Automation"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md HISTORY/BULLSHIT/BOOTH_BLACK_CANVAS_DISPLAY_REPLAY.md MASTER.md PRE_FLIGHT_Check.md features/booth/Black_Canvas_Display_Replay.js manifest.json
          git commit -m "Add Dev Black Canvas pre-BT fallback"
          git push --force-with-lease origin WITCH_DEV_BLACK_STARTUP_CANDIDATE_20260907
