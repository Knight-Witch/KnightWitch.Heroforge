name: Temporary Booth lifecycle candidate builder

on:
  push:
    branches:
      - WITCH_DEV_CACHE_CANDIDATE_20260907

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build isolated lifecycle candidate
        shell: bash
        run: |
          set -euo pipefail
          cp .github/tmp_booth_lifecycle_patch.py /tmp/tmp_booth_lifecycle_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/tmp_booth_lifecycle_patch.py')
          s = p.read_text(encoding='utf-8')
          fixes = [
              ('dev-booth-stabilization-2026-09-06""""', 'dev-booth-stabilization-2026-09-06\\""""'),
              ('dev-booth-lifecycle-repair-2026-09-07"""")', 'dev-booth-lifecycle-repair-2026-09-07\\"""")'),
              ('dev-black-canvas-pre-bt-fallback-2026-09-07""",', 'dev-black-canvas-pre-bt-fallback-2026-09-07\\"""",'),
              ('dev-booth-lifecycle-repair-2026-09-07""")', 'dev-booth-lifecycle-repair-2026-09-07\\"""")'),
          ]
          for old, new in fixes:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected one helper token {old!r}, got {s.count(old)}')
              s = s.replace(old, new, 1)

          gate_start = s.index('old_gate = """## Current Gate')
          gate_end = s.index('new_gate = """', gate_start)
          actual_gate = '''## Current Gate

1. Enable the Dev loader and disable public Stable for a clean test.
2. Verify Black Canvas Across Sessions ON can restore a fresh ordinary editor page to black without enabling Booth View.
3. Load a figure that already has saved Photo Booth configuration with Booth Persistence Across Sessions ON and refresh without opening native Photo Booth.
4. Expected: saved Booth View activates; if Black Canvas default is also ON, viewport is black.
5. Verify the known flash-causing action still does not flash.
6. Toggle Black Canvas OFF and confirm the ordinary HeroForge background returns.
7. Verify a fresh `+ New Figure` with no saved Booth configuration does not auto-bootstrap Booth.
8. Only after this combined Dev smoke passes should the bootstrap, replay v0.1.2, and loader cache repair be narrowly promoted to Public Stable.
'''
          s = s[:gate_start] + 'old_gate = ' + repr(actual_gate) + '\n' + s[gate_end:]
          p.write_text(s, encoding='utf-8', newline='\n')
          PY

          python3 -m py_compile /tmp/tmp_booth_lifecycle_patch.py
          git fetch origin WITCH_DEV_UI
          git checkout -B WITCH_DEV_BOOTH_LIFECYCLE_CANDIDATE_20260907 origin/WITCH_DEV_UI
          python3 /tmp/tmp_booth_lifecycle_patch.py

          node --check tools/Booth.js
          node --check features/booth/Black_Canvas_Display_Replay.js
          python3 -m json.tool manifest.json >/dev/null
          git diff --check

          expected="$(printf '%s\n' \
            CHANGELOG.md \
            HISTORY/BULLSHIT/BOOTH_BLACK_CANVAS_DISPLAY_REPLAY.md \
            HISTORY/BULLSHIT/BOOTH_RUNTIME_BOOTSTRAP.md \
            HISTORY/BULLSHIT/BOOTH_V27_STABILIZATION.md \
            MASTER.md \
            PRE_FLIGHT_Check.md \
            features/booth/Black_Canvas_Display_Replay.js \
            manifest.json \
            tools/Booth.js | sort)"
          actual="$(git diff --name-only origin/WITCH_DEV_UI...HEAD | sort)"
          printf 'Expected files:\n%s\nActual files:\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

          git config user.name "Knight Witch Dev Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            PRE_FLIGHT_Check.md \
            MASTER.md \
            manifest.json \
            tools/Booth.js \
            features/booth/Black_Canvas_Display_Replay.js \
            HISTORY/BULLSHIT/BOOTH_BLACK_CANVAS_DISPLAY_REPLAY.md \
            HISTORY/BULLSHIT/BOOTH_RUNTIME_BOOTSTRAP.md \
            HISTORY/BULLSHIT/BOOTH_V27_STABILIZATION.md
          git commit -m "Repair Dev Booth figure lifecycle and background restore"
          git push --force-with-lease origin WITCH_DEV_BOOTH_LIFECYCLE_CANDIDATE_20260907
