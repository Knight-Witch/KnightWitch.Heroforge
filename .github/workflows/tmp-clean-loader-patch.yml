name: Temporary Black Canvas finalization

on:
  push:
    branches:
      - WITCH_DEV_CACHE_CANDIDATE_20260907

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Document and validate candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin WITCH_DEV_UI WITCH_DEV_BLACK_STARTUP_CANDIDATE_20260907
          git checkout -B WITCH_DEV_BLACK_STARTUP_FINAL_20260907 origin/WITCH_DEV_BLACK_STARTUP_CANDIDATE_20260907
          python3 -c "from pathlib import Path; import base64; p=Path('CHANGELOG.md'); s=p.read_text(); h='# Changelog\\n\\n'; a=base64.b64decode('').decode(); assert s.startswith(h); p.write_text(h+a+'\\n---\\n\\n'+s[len(h):], encoding='utf-8', newline='\\n')"
          python3 -c "from pathlib import Path; import base64; p=Path('PRE_FLIGHT_Check.md'); s=p.read_text(); h='# Pre-Flight Check Log\\n\\n'; a=base64.b64decode('').decode(); assert s.startswith(h); p.write_text(h+a+'\\n---\\n\\n'+s[len(h):], encoding='utf-8', newline='\\n')"
          python3 -c "from pathlib import Path; import base64; p=Path('MASTER.md'); s=p.read_text(); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert s.count(old)==1; p.write_text(s.replace(old,new,1), encoding='utf-8', newline='\\n')"
          python3 -c "from pathlib import Path; import base64; p=Path('HISTORY/BULLSHIT/BOOTH_BLACK_CANVAS_DISPLAY_REPLAY.md'); s=p.read_text().rstrip(); a=base64.b64decode('').decode(); p.write_text(s+'\\n'+a, encoding='utf-8', newline='\\n')"

          node --check features/booth/Black_Canvas_Display_Replay.js
          python3 -m json.tool manifest.json >/dev/null
          python3 -c "import json; m=json.load(open('manifest.json')); r={x['id']:x for x in m['moduleRegistry']}['booth-black-canvas-display-replay']; assert r['version']=='0.1.2'; assert r['build']=='0.1.2-dev-stable-state-plus-pre-bt-background'; t={x['id']:x for x in m['tools']}['booth-black-canvas-display-replay']; assert 'v=0.1.2-dev-stable-state-plus-pre-bt-background' in t['url']"
          git diff --check

          test "$(git rev-parse HEAD:tools/Booth.js)" = "$(git rev-parse origin/WITCH_DEV_UI:tools/Booth.js)"
          test "$(git rev-parse HEAD:tools/Utilities.js)" = "$(git rev-parse origin/WITCH_DEV_UI:tools/Utilities.js)"
          test "$(git rev-parse HEAD:features/booth/Booth_Runtime_Bootstrap.js)" = "$(git rev-parse origin/WITCH_DEV_UI:features/booth/Booth_Runtime_Bootstrap.js)"
          test "$(git rev-parse HEAD:Witch_Dock_DEV.user.js)" = "$(git rev-parse origin/WITCH_DEV_UI:Witch_Dock_DEV.user.js)"
          test "$(git rev-parse HEAD:features/media/Spinny_Mini_WebP.js)" = "$(git rev-parse origin/WITCH_DEV_UI:features/media/Spinny_Mini_WebP.js)"
          test "$(git rev-parse HEAD:HeroForge_UI/Corrected_Bound_Decal_Gizmo.js)" = "$(git rev-parse origin/WITCH_DEV_UI:HeroForge_UI/Corrected_Bound_Decal_Gizmo.js)"

          expected="$(printf '%s\\n' CHANGELOG.md HISTORY/BULLSHIT/BOOTH_BLACK_CANVAS_DISPLAY_REPLAY.md MASTER.md PRE_FLIGHT_Check.md features/booth/Black_Canvas_Display_Replay.js manifest.json | sort)"
          actual="$(git diff --name-only origin/WITCH_DEV_UI...HEAD | sort)"
          test "$actual" = "$expected"

          git config user.name "Knight Witch Dev Automation"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md PRE_FLIGHT_Check.md MASTER.md HISTORY/BULLSHIT/BOOTH_BLACK_CANVAS_DISPLAY_REPLAY.md
          git commit -m "Document Dev Black Canvas pre-BT fallback"
          git push --force-with-lease origin WITCH_DEV_BLACK_STARTUP_FINAL_20260907
