name: Temporary Booth lifecycle candidate builder

on:
  push:
    branches:
      - WITCH_DEV_CACHE_CANDIDATE_20260907

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build isolated lifecycle candidate
        shell: bash
        run: |
          set -euo pipefail
          cp .github/tmp_booth_lifecycle_patch.py /tmp/tmp_booth_lifecycle_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/tmp_booth_lifecycle_patch.py')
          s = p.read_text(encoding='utf-8')
          bad = '      "versionOrigin": "dev-booth-stabilization-2026-09-06"""",'
          good = '      "versionOrigin": "dev-booth-stabilization-2026-09-06""",'
          if s.count(bad) != 1:
              raise SystemExit(f'Expected one malformed helper token, got {s.count(bad)}')
          p.write_text(s.replace(bad, good, 1), encoding='utf-8', newline='\n')
          PY

          python3 -m py_compile /tmp/tmp_booth_lifecycle_patch.py
          git fetch origin WITCH_DEV_UI
          git checkout -B WITCH_DEV_BOOTH_LIFECYCLE_CANDIDATE_20260907 origin/WITCH_DEV_UI
          python3 /tmp/tmp_booth_lifecycle_patch.py

          node --check tools/Booth.js
          node --check features/booth/Black_Canvas_Display_Replay.js
          python3 -m json.tool manifest.json >/dev/null
          git diff --check

          expected="$(printf '%s\n' \
            CHANGELOG.md \
            HISTORY/BULLSHIT/BOOTH_BLACK_CANVAS_DISPLAY_REPLAY.md \
            HISTORY/BULLSHIT/BOOTH_RUNTIME_BOOTSTRAP.md \
            HISTORY/BULLSHIT/BOOTH_V27_STABILIZATION.md \
            MASTER.md \
            PRE_FLIGHT_Check.md \
            features/booth/Black_Canvas_Display_Replay.js \
            manifest.json \
            tools/Booth.js | sort)"
          actual="$(git diff --name-only origin/WITCH_DEV_UI...HEAD | sort)"
          printf 'Expected files:\n%s\nActual files:\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

          git config user.name "Knight Witch Dev Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            PRE_FLIGHT_Check.md \
            MASTER.md \
            manifest.json \
            tools/Booth.js \
            features/booth/Black_Canvas_Display_Replay.js \
            HISTORY/BULLSHIT/BOOTH_BLACK_CANVAS_DISPLAY_REPLAY.md \
            HISTORY/BULLSHIT/BOOTH_RUNTIME_BOOTSTRAP.md \
            HISTORY/BULLSHIT/BOOTH_V27_STABILIZATION.md
          git commit -m "Repair Dev Booth figure lifecycle and background restore"
          git push --force-with-lease origin WITCH_DEV_BOOTH_LIFECYCLE_CANDIDATE_20260907
