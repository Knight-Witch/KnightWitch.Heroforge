name: Materialize Spinny Stable Candidate
on:
  push:
    branches: [spinny-stable-promotion-helper]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion helper
        uses: actions/checkout@v4
        with:
          ref: spinny-stable-promotion-helper
          path: helper
          fetch-depth: 1
      - name: Checkout Stable candidate
        uses: actions/checkout@v4
        with:
          ref: spinny-stable-candidate
          path: target
          fetch-depth: 0
      - name: Fetch validated Dev source
        shell: bash
        run: git -C target fetch origin WITCH_DEV_UI:refs/remotes/origin/WITCH_DEV_UI
      - name: Apply and verify narrow Stable promotion
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python ../helper/.github/scripts/promote_spinny_stable.py
          sed -i 's/Validated Spinny Mini animated WebP capture service for Witch Dock Dev\./Validated Spinny Mini animated WebP capture service for Witch Dock./' features/media/Spinny_Mini_WebP.js
          sed -i 's/| Spinny service | `spinny-mini-webp` | `features\/media\/Spinny_Mini_WebP.js` | \*\*Live \/ Stable validated\*\* |/| Spinny service | `spinny-mini-webp` | `features\/media\/Spinny_Mini_WebP.js` | **Live \/ Stable promoted; public smoke pending** |/' MASTER.md
          sed -i 's/| Spinny UI | `spinny-mini-webp-ui` | `features\/media\/Spinny_Mini_WebP_UI.js` | \*\*Live \/ Stable validated\*\* |/| Spinny UI | `spinny-mini-webp-ui` | `features\/media\/Spinny_Mini_WebP_UI.js` | **Live \/ Stable promoted; public smoke pending** |/' MASTER.md
          sed -i 's/Public status: \*\*Witch Dock Stable promotion approved \/ candidate static gate required\*\*/Public status: **Witch Dock Stable promoted \/ public smoke pending**/' HISTORY/BULLSHIT/SPINNY_MINI_WEBP.md
          node --check features/media/Spinny_Mini_WebP.js
      - name: Commit Stable candidate
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name "Knight Witch"
          git config user.email "amanda.m.ivans@gmail.com"
          sed -i 's/[[:space:]]\+$//' HISTORY/BULLSHIT/SPINNY_MINI_WEBP.md
          git add Witch_Dock.user.js manifest.json features/media/Spinny_Mini_WebP.js features/media/Spinny_Mini_WebP_UI.js HISTORY/BULLSHIT/SPINNY_MINI_WEBP.md MASTER.md PRE_FLIGHT_Check.md CHANGELOG.md
          git diff --cached --check
          git commit -m "Release Witch Dock v1.1.0 Spinny Mini WebP"
          git push origin HEAD:spinny-stable-candidate
