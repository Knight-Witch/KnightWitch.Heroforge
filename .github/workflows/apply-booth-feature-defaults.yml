name: Apply Booth Feature Defaults

on:
  push:
    branches:
      - witch-booth-features-helper
    paths:
      - '_tools/apply_booth_feature_defaults.py'
      - '.github/workflows/apply-booth-feature-defaults.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper
        uses: actions/checkout@v4
        with:
          ref: witch-booth-features-helper
          path: helper

      - name: Checkout WITCH_DEV_UI
        uses: actions/checkout@v4
        with:
          ref: WITCH_DEV_UI
          fetch-depth: 0
          path: target

      - name: Remove redundant legacy consent mount gate from helper patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('helper/_tools/apply_booth_feature_defaults.py')
          s = p.read_text(encoding='utf-8')
          needle = "booth = booth.replace(\"    consentCb.checked = state.consent;\\n\\n\", \"\")\n"
          replacement = needle + "booth = booth.replace(\"    if (state.consent) startLoop();\\n\\n\", \"\")\n"
          if needle not in s:
              raise SystemExit('helper patch anchor missing')
          p.write_text(s.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Apply and validate Booth defaults patch
        working-directory: target
        run: python ../helper/_tools/apply_booth_feature_defaults.py

      - name: Commit Dev candidate
        working-directory: target
        run: |
          git config user.name 'Knight Witch'
          git config user.email 'amanda.m.ivans@gmail.com'
          git status --short
          git add Witch_Dock_DEV.user.js tools/Booth.js tools/Utilities.js manifest.json MASTER.md PRE_FLIGHT_Check.md CHANGELOG.md HISTORY/BULLSHIT/BOOTH_RENDERS_EXPORTS.md
          git diff --cached --check
          git commit -m 'Add Booth cross-session defaults in Utilities'
          git push origin HEAD:WITCH_DEV_UI
