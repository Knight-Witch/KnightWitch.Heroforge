name: Materialize Developer Mode Public Readiness
on:
  push:
    branches: [witch-devmode-public-helper]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper
        uses: actions/checkout@v4
        with:
          ref: witch-devmode-public-helper
          path: helper
      - name: Checkout WITCH_DEV_UI
        uses: actions/checkout@v4
        with:
          ref: WITCH_DEV_UI
          path: target
          fetch-depth: 0
      - name: Record High Res validation
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python ../helper/.github/scripts/record_highres_cleanup_pass.py
          git diff --check
          git config user.name "Knight Witch"
          git config user.email "amanda.m.ivans@gmail.com"
          git add CHANGELOG.md PRE_FLIGHT_Check.md MASTER.md HISTORY/BULLSHIT/WITCH_DOCK_UI_FOLLOWUPS.md
          git diff --cached --check
          git commit -m "Validate High Res service UI cleanup"
      - name: Prepare Developer Mode public-readiness candidate
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python ../helper/.github/scripts/prepare_developer_mode_public.py
      - name: Static gate
        shell: bash
        run: |
          set -euo pipefail
          cd target
          node --check Witch_Dock_DEV.user.js
          node --check features/core/Witch_Dock_Developer_Mode.js
          python -m json.tool manifest.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          dev=Path('features/core/Witch_Dock_Developer_Mode.js').read_text()
          loader=Path('Witch_Dock_DEV.user.js').read_text()
          m=json.loads(Path('manifest.json').read_text())
          reg={x['id']:x for x in m['moduleRegistry']}
          assert reg['witch-dock-developer-mode']['version']=='0.3.0'
          assert reg['witch-dock-developer-mode']['build']=='0.3.0-public-ready-manifest-source'
          assert reg['witch-dock-dev-loader']['version']=='0.4.0'
          assert reg['witch-dock-dev-loader']['build']=='1.0.8.4-devmode-manifest-source'
          assert 'WITCH_DEV_UI/manifest.json' not in dev
          assert 'Witch_Scripts/manifest.json' in dev
          assert 'KWWitchDockManifestURL' in dev
          assert 'KWWitchDockManifestURL = MANIFEST_URL' in loader
          assert "return UW.localStorage.getItem(STORE_KEY) === 'true'" in dev
          assert "const STORE_KEY = 'kw.witchDock.developerMode.v1'" in dev
          assert 'getRegistryUrl' in dev
          assert '// @version      0.3.0' in dev
          assert '// @version      1.0.8.4' in loader
          print('Developer Mode public-readiness static gate: PASS')
          PY
          git diff --check
      - name: Commit Developer Mode candidate and push both commits
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git add Witch_Dock_DEV.user.js features/core/Witch_Dock_Developer_Mode.js manifest.json CHANGELOG.md PRE_FLIGHT_Check.md MASTER.md HISTORY/BULLSHIT/WITCH_DOCK_UI_FOLLOWUPS.md
          git diff --cached --check
          git commit -m "Make Developer Mode public-ready in Dev"
          git push origin HEAD:WITCH_DEV_UI
